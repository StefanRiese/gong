name: Release

# Push a tag like v0.1.0 to build Linux/Windows/macOS archives and publish a
# GitHub release. install.sh downloads the Linux archive from there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 = glibc 2.35 → binaries also run on Debian 12 (2.36) and 13.
          - { name: linux-x64, os: ubuntu-22.04, publish: true }
          - { name: linux-arm64, os: ubuntu-22.04-arm, publish: true }
          # Single tray exe (GUI subsystem, embedded web UI, winsqlite3.dll).
          - { name: windows-x64, os: windows-latest, publish: true }
          # Per-architecture server builds, merged into the universal app below.
          - { name: macos-arm64, os: macos-latest, publish: false }
          - { name: macos-x64, os: macos-15-intel, publish: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for VERSION
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - name: Build
        shell: bash
        run: bash deploy/build-release.sh
      - name: Upload release files
        if: matrix.publish
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.tar.gz*
            dist/*.exe*
          if-no-files-found: error
      - name: Upload server build for the macOS app
        if: ${{ !matrix.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  macos-app:
    name: Build macOS universal app
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-macos-arm64
          path: dist/macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: build-macos-x64
          path: dist/macos-x64
      - name: Build app bundle
        run: |
          # Artifacts lose the executable bit.
          chmod +x dist/macos-*/bin/server
          bash deploy/build-macos-app.sh dist/macos-arm64 dist/macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: dist/*.zip*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build, macos-app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # previous tag for the compare link
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: bash deploy/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
